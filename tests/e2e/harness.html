<!doctype html>
<html><head><meta charset="utf-8"><title>Extension harness</title>
<style>body{margin:0;display:flex;height:100vh} #inbox{flex:1;border:0} #panel{width:380px;border:0;border-left:1px solid #ccc}</style></head>
<body>
<iframe id="inbox" name="content"></iframe>
<iframe id="panel" name="panel"></iframe>
<script type="module">
	// Background service worker runs in this top frame with the mocked chrome API.
	await import( '/ext/background.js' );
	const qs = new URLSearchParams( location.search );
	document.getElementById( 'inbox' ).src = '/e2e/mock-inbox.html?' + qs.get( 'inbox' );
	window.__bus.tabUrl = 'https://business.facebook.com/latest/inbox/all?' + qs.get( 'inbox' );
	document.getElementById( 'panel' ).src = '/ext/sidepanel/index.html';
</script>
</body></html>
