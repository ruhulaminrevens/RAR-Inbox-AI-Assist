<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mock Meta Business Suite inbox (sanitised test fixture)</title>
<style>
	body { margin: 0; font-family: system-ui, sans-serif; }
	header { height: 56px; background: #1c2b33; color: #fff; display: flex; align-items: center; padding: 0 16px; }
	.layout { display: flex; height: calc(100vh - 56px); }
	nav { width: 240px; border-right: 1px solid #ddd; }
	main { flex: 1; display: flex; flex-direction: column; }
	.thread { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
	.row { display: flex; }
	.row.me { justify-content: flex-end; }
	.bubble { max-width: 60%; padding: 8px 12px; border-radius: 16px; background: #eee; }
	.me .bubble { background: #0a7cff; color: #fff; }
	.composer { border-top: 1px solid #ddd; padding: 8px; display: flex; gap: 8px; }
	.composer [contenteditable] { flex: 1; min-height: 40px; border: 1px solid #ccc; border-radius: 8px; padding: 8px; }
	time { font-size: 11px; color: #777; text-align: center; }
</style>
</head>
<body>
<header role="banner"><span dir="auto">Inbox</span></header>
<div class="layout">
	<nav role="navigation"><div dir="auto">Customer A</div><div dir="auto">Customer B</div></nav>
	<main role="main">
		<div class="thread" id="thread">
			<time>12:20</time>
			<div class="row"><div class="bubble"><div dir="auto">2-3 din er moddhe asbo time kore</div></div></div>
			<div class="row me"><div class="bubble"><div dir="auto">Ok</div></div></div>
			<div class="row"><div class="bubble"><div dir="auto" id="last-customer">Assalamu alaikum. Apnader office ajke khola koyta porjonto?</div></div></div>
		</div>
		<div class="composer">
			<div contenteditable="true" role="textbox" aria-label="Reply in Messenger" id="composer"></div>
			<button type="button" id="send" onclick="window.__sent = true">Send</button>
		</div>
	</main>
</div>
<script>
	window.__sent = false;
	window.__enter = 0;
	window.__clicks = 0;
	document.addEventListener( 'keydown', ( e ) => { if ( e.key === 'Enter' ) { window.__enter++; } }, true );
	document.addEventListener( 'click', ( e ) => { if ( e.isTrusted === false ) { window.__clicks++; } }, true );
</script>
<script src="/ext/content/inbox-adapter.js"></script>
<script src="/ext/content/composer.js"></script>
<script src="/ext/content/main.js"></script>
</body>
</html>
